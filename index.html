<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma pergunta... ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5f7;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#ffd6e0 1.2px, transparent 1.2px);
      background-size: 26px 26px;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 32px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 14px 40px rgba(255, 150, 170, 0.15),
                  0 4px 14px rgba(255, 150, 170, 0.08);
      border: 1.5px solid #ffe0e8;
    }

    .hello-kitty {
      width: 90px;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(255, 140, 160, 0.25));
      animation: bounce 2.8s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.55rem;
      font-weight: 500;
      color: #5c3d4a;
      line-height: 1.45;
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }

    .botoes {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    button {
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 13px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #btn-sim {
      background: linear-gradient(135deg, #ff9aab, #ff7a92);
      color: #fff;
      box-shadow: 0 5px 18px rgba(255, 122, 146, 0.4);
    }

    #btn-sim:hover {
      transform: scale(1.07);
      box-shadow: 0 7px 22px rgba(255, 122, 146, 0.5);
      background: linear-gradient(135deg, #ffa8b7, #ff8a9e);
    }

    #btn-sim:active {
      transform: scale(0.96);
    }

    #btn-nao {
      background: #fff0f3;
      color: #c48a96;
      border: 1.5px solid #ffd0da;
      z-index: 999;
    }

    #nao-spacer {
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.35rem; }
      .hello-kitty { width: 78px; }
      button { padding: 12px 24px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="card">
    <svg class="hello-kitty" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="32" cy="28" rx="18" ry="22" fill="#fff"/>
      <ellipse cx="88" cy="28" rx="18" ry="22" fill="#fff"/>
      <ellipse cx="32" cy="30" rx="10" ry="13" fill="#ff9aab"/>
      <ellipse cx="88" cy="30" rx="10" ry="13" fill="#ff9aab"/>
      <circle cx="60" cy="62" r="42" fill="#fff" stroke="#f5d0d8" stroke-width="1.5"/>
      <ellipse cx="82" cy="28" rx="16" ry="11" fill="#ff5c7a" transform="rotate(-18 82 28)"/>
      <ellipse cx="98" cy="32" rx="14" ry="10" fill="#ff5c7a" transform="rotate(22 98 32)"/>
      <circle cx="90" cy="30" r="7" fill="#ff3d5e"/>
      <ellipse cx="44" cy="60" rx="5.5" ry="7" fill="#3d2c2e"/>
      <ellipse cx="76" cy="60" rx="5.5" ry="7" fill="#3d2c2e"/>
      <ellipse cx="60" cy="72" rx="4" ry="3" fill="#ff9aab"/>
      <line x1="18" y1="68" x2="38" y2="70" stroke="#d4a0a8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="76" x2="38" y2="76" stroke="#d4a0a8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="84" x2="38" y2="82" stroke="#d4a0a8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="102" y1="68" x2="82" y2="70" stroke="#d4a0a8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="104" y1="76" x2="82" y2="76" stroke="#d4a0a8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="102" y1="84" x2="82" y2="82" stroke="#d4a0a8" stroke-width="1.8" stroke-linecap="round"/>
    </svg>

    <h1>Quer sair sexta? 🥳</h1>

    <div class="botoes">
      <button id="btn-sim">Sim</button>
      <button id="btn-nao">Não</button>
    </div>
  </div>

  <script>
    // ============================================
    //  COLE A URL DO SEU WEBHOOK AQUI EM BAIXO
    // ============================================
    const URL_WEBHOOK_DISCORD = "https://discord.com/api/webhooks/1558169971799105596/8lBLYLGLSbWpZg6miDbfAQ7MngOpT9noxYVyPcyvQNTgkkbFH13sZMnG0h-3SHdYti8X";

    // Tempo de entrada na página
    const tempoEntrada = Date.now();

    // Contador de tentativas no botão "Não"
    let tentativasNao = 0;

    const btnNao = document.getElementById('btn-nao');
    const btnSim = document.getElementById('btn-sim');
    const botoes = document.querySelector('.botoes');

    // Centraliza os botões e transforma o "Não" em fixed
    function alinharBotaoNao() {
      btnNao.style.position = 'static';
      btnNao.style.left = '';
      btnNao.style.top = '';

      const rect = btnNao.getBoundingClientRect();

      let spacer = document.getElementById('nao-spacer');
      if (!spacer) {
        spacer = document.createElement('div');
        spacer.id = 'nao-spacer';
        botoes.appendChild(spacer);
      }
      spacer.style.width = btnNao.offsetWidth + 'px';
      spacer.style.height = btnNao.offsetHeight + 'px';

      btnNao.style.position = 'fixed';
      btnNao.style.left = rect.left + 'px';
      btnNao.style.top = rect.top + 'px';
    }

    window.addEventListener('load', alinharBotaoNao);
    window.addEventListener('resize', alinharBotaoNao);

    // Função que faz o botão "Não" fugir + conta tentativas
    function foge() {
      tentativasNao++;

      const btnW = btnNao.offsetWidth;
      const btnH = btnNao.offsetHeight;
      const maxX = window.innerWidth - btnW;
      const maxY = window.innerHeight - btnH;

      const novoX = Math.random() * maxX;
      const novoY = Math.random() * maxY;

      btnNao.style.left = novoX + 'px';
      btnNao.style.top = novoY + 'px';
    }

    // Formata o tempo em minutos e segundos
    function formatarTempo(segundos) {
      const min = Math.floor(segundos / 60);
      const seg = segundos % 60;
      if (min > 0) {
        return `${min}m e ${seg}s`;
      }
      return `${seg}s`;
    }

    // Função do botão "Sim"
    function aceitou() {
      const tempoTotalSegundos = Math.floor((Date.now() - tempoEntrada) / 1000);
      const tempoFormatado = formatarTempo(tempoTotalSegundos);

      // Alert fofinho pra ela
      alert("Fechou! Domingo às 14h eu ligo o PC kkk. Me manda o print!");

      // Mensagem limpa pro Discord
      const mensagem = 
`🚨 **NOVA INTERAÇÃO NO SITE DO MIGUÉ!** 🚨
✨ **Resultado:** Clicou no SIM! 
⏱️ **Tempo gasto no site:** ${tempoFormatado}
❌ **Tentativas de clicar no NÃO:** ${tentativasNao} vezes
O plano do domingo de tarde tá ativo!`;

      // Envia pro Webhook
      fetch(URL_WEBHOOK_DISCORD, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          content: mensagem
        })
      }).catch(() => {
        // silencioso caso dê erro (não atrapalha a experiência dela)
      });
    }

    // Eventos do botão "Não"
    btnNao.addEventListener('mouseover', foge);

    btnNao.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      foge();
    });

    btnNao.addEventListener('touchstart', (e) => {
      e.preventDefault();
      foge();
    }, { passive: false });

    // Evento do botão "Sim"
    btnSim.addEventListener('click', aceitou);
  </script>
</body>
</html>
